
name: Backstage CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint:all

      - name: TypeScript check
        run: yarn tsc

      - name: Run tests
        run: yarn test

      - name: Build Backstage
        run: yarn build:backend

      - name: Build Docker image
        run: docker build -f packages/backend/Dockerfile -t backstage:ci .

  
  publish-image:
    name: Publish Backstage to ECR
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Backstage
        run: |
          yarn tsc
          yarn build:backend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::589077667712:role/backstage-github-ecr-publisher
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: devopsportfolio-backstage
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f packages/backend/Dockerfile \
            -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .

          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
