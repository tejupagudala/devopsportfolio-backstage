
name: Backstage CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint:all

      - name: TypeScript check
        run: yarn tsc

      - name: Run tests
        run: yarn test

      - name: Build Backstage
        run: yarn build:backend

      - name: Build Docker image
        run: docker build -f packages/backend/Dockerfile -t backstage:ci .
