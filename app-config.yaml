
# ==========================================
# DevOps Portfolio Backstage
# Base Configuration - Local Development
# ==========================================

app:
  title: DevOps Portfolio IDP
  baseUrl: http://localhost:3000

  packages: all

  extensions:
    - page:catalog:
        config:
          path: /

organization:
  name: DevOps Portfolio

# ==========================================
# Backend
# ==========================================

backend:
  baseUrl: http://localhost:7007

  listen:
    port: 7007

  csp:
    connect-src: ["'self'", "http:", "https:"]

  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

  # Local development only.
  # Production uses PostgreSQL on RDS.
  database:
    client: better-sqlite3
    connection: ':memory:'

  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder

# ==========================================
# GitHub Integration
# ==========================================

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

# ==========================================
# TechDocs
# ==========================================

techdocs:
  builder: local

  generator:
    runIn: docker

  publisher:
    type: local

# ==========================================
# Authentication
# ==========================================

# GitHub OAuth provider is configured separately
# in app-config.production.yaml.
# Guest authentication is not configured here.

auth:
  clientIdMetadataDocuments:
    enabled: false

# ==========================================
# Software Catalog
# ==========================================

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration

  rules:
    - allow: [Component, System, API, Resource, Location]

  locations:
    - type: file
      target: ../../examples/entities.yaml

    - type: file
      target: ../../examples/template/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

# ==========================================
# Permissions
# ==========================================

permission:
  enabled: true

# ==========================================
# MCP Actions
# ==========================================

mcpActions:
  name: DevOps Portfolio Backstage
  description: Developer portal for managing services and platform templates
