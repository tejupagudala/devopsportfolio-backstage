
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-runtime
  namespace: backstage
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: backstage-runtime
    creationPolicy: Owner

  data:
    # RDS-managed credentials
    - secretKey: POSTGRES_USER
      remoteRef:
        key: backstage-idp-rds-secret-arn-placeholder
        property: username

    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: backstage-idp-rds-secret-arn-placeholder
        property: password

    # GitHub OAuth credentials
    - secretKey: GITHUB_CLIENT_ID
      remoteRef:
        key: backstage/idp/oauth
        property: GITHUB_CLIENT_ID

    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: backstage/idp/oauth
        property: GITHUB_CLIENT_SECRET

    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: backstage/idp/oauth
        property: GITHUB_TOKEN

    # Database connection details
    - secretKey: POSTGRES_HOST
      remoteRef:
        key: backstage/idp/oauth
        property: POSTGRES_HOST

    - secretKey: POSTGRES_PORT
      remoteRef:
        key: backstage/idp/oauth
        property: POSTGRES_PORT
