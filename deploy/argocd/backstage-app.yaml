
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: backstage
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/tejupagudala/devopsportfolio-backstage.git
    targetRevision: main
    path: deploy/helm/backstage

    helm:
      releaseName: backstage
      parameters:
        - name: image.tag
          value: "YOUR_ECR_IMAGE_TAG"

        - name: ingress.enabled
          value: "true"

        - name: ingress.certificateArn
          value: "YOUR_ACM_CERTIFICATE_ARN"

        - name: ingress.allowedCidrs
          value: "YOUR_PUBLIC_IP/32"

  destination:
    server: https://kubernetes.default.svc
    namespace: backstage

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
