
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: backstage
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/tejupagudala/devopsportfolio-backstage.git
    targetRevision: main
    path: deploy/helm/backstage

    helm:
      releaseName: backstage
      parameters:
        - name: image.tag
          value: "3b4cccc80f39408c0a8a9734017b278e7a5a3a24"

        - name: ingress.enabled
          value: "true"

        - name: ingress.certificateArn
          value: "arn:aws:acm:us-east-1:589077667712:certificate/37ac6035-42d9-4efe-904a-197295ce0b81"

        - name: ingress.allowedCidrs
          value: "75.210.13.252/32"

  destination:
    server: https://kubernetes.default.svc
    namespace: backstage

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
