
# ==========================================
# Backstage Production Configuration
# Domain: idp.devopsportfolio.com
# Platform: AWS EKS
# ==========================================

app:
  title: DevOps Portfolio IDP
  baseUrl: https://idp.devopsportfolio.com

organization:
  name: DevOps Portfolio

backend:
  baseUrl: https://idp.devopsportfolio.com

  listen:
    port: 7007
    host: 0.0.0.0

  cors:
    origin: https://idp.devopsportfolio.com
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

  # PostgreSQL will run on Amazon RDS.
  # Values will be provided securely at deployment time.
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      ssl:
        require: true
        rejectUnauthorized: true
        ca:
           $file: ./certs/rds-ca.pem

# GitHub integration for software catalog and templates.
# GITHUB_TOKEN will be provided as a secret.
integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

# Production authentication.
# GitHub OAuth will be configured before public deployment.
# Guest authentication is disabled in production.

auth:
  environment: production
  providers:
    github:
      production:
        clientId: ${GITHUB_CLIENT_ID}
        clientSecret: ${GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: userIdMatchingUserEntityAnnotation


# Catalog: portfolio services and future golden templates.
catalog:
  locations:
    - type: url
      target: https://github.com/tejupagudala/devopsportfolio-backstage/blob/main/catalog-info.yaml

# TechDocs: basic configuration for initial deployment.
# We'll move published documentation to S3 later.
techdocs:
  builder: local
  generator:
    runIn: docker
  publisher:
    type: local
